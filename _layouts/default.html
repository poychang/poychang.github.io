<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}"
  >

  <style>
    :root {
      --bg-1: #07111d;
      --bg-2: #0d1b2a;
      --surface: rgba(14, 27, 41, 0.8);
      --surface-strong: rgba(19, 35, 52, 0.96);
      --line: rgba(148, 163, 184, 0.2);
      --text: #e2e8f0;
      --muted: #a7b5c8;
      --accent: #7dd3fc;
      --accent-2: #c4b5fd;
      --success: #86efac;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background:
        radial-gradient(circle at top left, rgba(125, 211, 252, 0.14), transparent 32%),
        radial-gradient(circle at bottom right, rgba(196, 181, 253, 0.12), transparent 28%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      line-height: 1.7;
    }

    .readme {
      max-width: 980px;
      margin: 0 auto;
      padding: 36px 28px 48px;
      background: rgba(8, 15, 23, 0.72);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .readme > :first-child {
      margin-top: 0;
    }

    .readme h1,
    .readme h2,
    .readme h3 {
      color: #f8fafc;
      letter-spacing: -0.04em;
      line-height: 1.2;
    }

    .readme h1 {
      font-size: clamp(2.1rem, 3vw, 3.2rem);
      margin: 18px 0 8px;
    }

    .readme h2 {
      margin-top: 2rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid var(--line);
      font-size: 1.5rem;
    }

    .readme p,
    .readme li {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .readme a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .readme a:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    .readme hr {
      height: 1px;
      border: none;
      background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.5), transparent);
      margin: 28px 0;
    }

    .readme img {
      max-width: 100%;
    }

    .profile-shell {
      display: grid;
      gap: 1.4rem;
      margin-top: 18px;
    }

    .profile-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      flex-wrap: wrap;
      padding: 12px 0 8px;
    }

    .profile-avatar {
      width: 138px;
      height: 138px;
      border-radius: 50%;
      border: 3px solid rgba(125, 211, 252, 0.5);
      box-shadow: 0 18px 40px rgba(14, 116, 144, 0.28);
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.24), rgba(196, 181, 253, 0.18));
      padding: 4px;
    }

    .profile-badge-row,
    .profile-link-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .profile-badge-row {
      margin: 8px 0 16px;
    }

    .profile-intro {
      text-align: center;
      padding: 0.25rem 0 0.75rem;
    }

    .profile-mini {
      margin: 0 auto;
      max-width: 720px;
      font-size: 1.1rem;
      color: var(--muted);
    }

    .profile-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin: 1.2rem 0 1.6rem;
      align-items: stretch;
    }

    .profile-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.72));
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 18px;
      padding: 18px 18px 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .profile-card:hover {
      transform: translateY(-2px);
      border-color: rgba(125, 211, 252, 0.26);
    }

    .profile-card-highlight {
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.18), rgba(15, 23, 42, 0.78));
      border-color: rgba(125, 211, 252, 0.2);
    }

    .profile-card-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .profile-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .profile-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      background: rgba(125, 211, 252, 0.1);
      border: 1px solid rgba(125, 211, 252, 0.18);
      color: #d9f2ff;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.2;
    }

    ul {
      padding-left: 1.2rem;
    }

    li + li {
      margin-top: 0.5rem;
    }

    blockquote {
      margin: 1.5rem 0;
      padding: 0.9rem 1.1rem;
      border-left: 4px solid rgba(125, 211, 252, 0.9);
      background: rgba(125, 211, 252, 0.05);
      border-radius: 0 12px 12px 0;
      color: #dfeaf6;
    }

    @media screen and (max-width: 600px) {
      body {
        padding: 24px 14px;
      }

      .readme {
        padding: 22px 16px 28px;
        border-radius: 18px;
      }

      .profile-head {
        gap: 0.8rem;
      }

      .profile-avatar {
        width: 116px;
        height: 116px;
      }
    }
  </style>
</head>

<body>
  <main class="readme">
    {{ content }}
  </main>
</body>
</html>
